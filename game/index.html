<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora Run — a dawn flight game</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1c2c;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  #game-canvas { display: block; width: 100%; height: 100%; }

  /* ---- HUD ---- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5;
    color: #eaf6ff; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  .panel { position: absolute; background: rgba(8, 24, 40, 0.62);
    border: 1px solid rgba(140, 210, 255, 0.45); border-radius: 10px;
    padding: 10px 14px; backdrop-filter: blur(2px);
    box-shadow: 0 0 18px rgba(60, 160, 255, 0.25), inset 0 0 24px rgba(80,180,255,.08); }
  #panel-left { top: 14px; left: 14px; display: flex; gap: 18px; }
  #panel-top { top: 14px; left: 50%; transform: translateX(-50%); text-align: center;
    min-width: 380px; max-width: 520px; }
  #panel-right { top: 14px; right: 14px; display: flex; flex-direction: column; gap: 6px;
    min-width: 210px; }
  .gauge { display: flex; flex-direction: column; align-items: center; min-width: 64px; }
  .label { font-size: 10px; letter-spacing: 2px; color: #8fd0ff; }
  .value { font-size: 26px; font-weight: 700; line-height: 1.1; color: #fff;
    font-variant-numeric: tabular-nums; }
  .value.small { font-size: 15px; }
  .unit { font-size: 10px; letter-spacing: 1px; color: #bfe6ff; }
  #hud-mission { font-size: 15px; font-weight: 700; letter-spacing: .5px; color: #ffd98a; }
  #hud-sub { font-size: 12px; color: #cfe9ff; margin-top: 2px; }
  .bar-row { display: flex; align-items: center; gap: 8px; }
  .bar { flex: 1; height: 10px; border-radius: 5px; background: rgba(255,255,255,.15);
    overflow: hidden; border: 1px solid rgba(255,255,255,.25); }
  .bar > div { height: 100%; width: 100%; border-radius: 5px;
    background: linear-gradient(90deg, #37c978, #8bf0ae); transition: width .2s; }
  #hud-dmg-fill { background: linear-gradient(90deg, #ffb347, #ff5a3c); width: 0%; }
  .bar > div.low { background: linear-gradient(90deg, #ff5a3c, #ff9a3c); }
  #hud-toast { position: absolute; bottom: 88px; left: 50%; transform: translateX(-50%);
    background: rgba(8, 24, 40, 0.78); border: 1px solid rgba(255, 217, 138, 0.6);
    color: #ffe9b8; font-size: 16px; font-weight: 600; padding: 9px 20px; border-radius: 20px;
    opacity: 0; transition: opacity .3s; white-space: nowrap; }
  #hud-toast.show { opacity: 1; }
  #hud-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 15px; color: rgba(255,255,255,.85); opacity: 0; }

  /* ---- Title / end overlay ---- */
  #overlay { position: fixed; inset: 0; z-index: 10; display: none;
    align-items: center; justify-content: center; pointer-events: auto;
    background: radial-gradient(ellipse at center, rgba(6,18,32,.25) 0%, rgba(6,18,32,.62) 100%); }
  #overlay.show { display: flex; }
  #overlay-card { text-align: center; color: #f2f8ff; padding: 34px 48px;
    background: rgba(8, 24, 40, 0.55); border: 1px solid rgba(140, 210, 255, 0.4);
    border-radius: 16px; box-shadow: 0 0 40px rgba(60,160,255,.3); max-width: 640px; }
  #overlay-title { font-size: 54px; letter-spacing: 8px; font-weight: 800;
    color: #ffd98a; text-shadow: 0 0 24px rgba(255, 180, 60, .55); }
  #overlay-body { font-size: 17px; margin-top: 12px; line-height: 1.5; color: #dcefff; }
  #overlay-controls { font-size: 13px; margin-top: 18px; color: #9fd4ff; letter-spacing: .5px; }
  #overlay-hint { font-size: 14px; margin-top: 16px; color: #ffe9b8; font-weight: 700;
    animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
